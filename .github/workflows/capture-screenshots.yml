name: Capture Streamlit Screenshots

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start Streamlit app
        run: |
          PYTHONPATH=src nohup python -m streamlit run app/streamlit_app.py --server.headless true --server.port 8501 --server.address 127.0.0.1 > /tmp/streamlit.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health > /dev/null; then
              echo "Streamlit is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Streamlit failed to start"
          cat /tmp/streamlit.log
          exit 1

      - name: Capture screenshots
        run: |
          mkdir -p docs/screenshots
          cat > /tmp/capture.py <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path("docs/screenshots")
          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox"])
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              page.goto("http://127.0.0.1:8501", wait_until="domcontentloaded", timeout=60_000)
              page.get_by_role("heading", name="Multi-Asset Backtesting Engine").wait_for(timeout=60_000)
              page.wait_for_timeout(3_000)
              page.screenshot(path=out / "01-dashboard.png", full_page=False)

              page.locator('[data-baseweb="select"]').nth(1).click()
              page.get_by_role("option", name="Mean Reversion", exact=True).click()
              page.wait_for_timeout(4_000)
              page.screenshot(path=out / "02-mean-reversion.png", full_page=False)

              page.locator('[data-baseweb="select"]').nth(0).click()
              page.get_by_role("option", name="S&P 500 E-mini", exact=True).click()
              page.wait_for_timeout(4_000)
              page.screenshot(path=out / "03-es-futures.png", full_page=False)
              browser.close()
          PY
          python /tmp/capture.py
          file docs/screenshots/*.png

      - name: Add screenshots to README
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text()
          marker = "## How it works\n"
          section = """## Screenshots\n\nThe following screenshots are captured from the running Streamlit application and show the interactive dashboard across supported strategies and assets.\n\n![Dashboard — Gold with Moving Average Crossover](docs/screenshots/01-dashboard.png)\n\n*Dashboard with the Gold asset and Moving Average Crossover strategy.*\n\n![Mean Reversion strategy](docs/screenshots/02-mean-reversion.png)\n\n*Mean Reversion strategy selected in the same interactive dashboard.*\n\n![S&P 500 E-mini futures](docs/screenshots/03-es-futures.png)\n\n*S&P 500 E-mini futures selected to demonstrate the multi-asset workflow.*\n\n"""
          if "## Screenshots\n" not in text:
              text = text.replace(marker, section + marker, 1)
              path.write_text(text)
          PY

      - name: Commit screenshots and remove capture workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots README.md
          git rm .github/workflows/capture-screenshots.yml
          git commit -m "docs: add Streamlit screenshots"
          git push
