name: Capture app screenshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Skip after the generated commit
        id: guard
        run: |
          if [ ! -f .github/workflows/capture-screenshots.yml ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and browser dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start the Streamlit app
        if: steps.guard.outputs.skip != 'true'
        run: |
          PYTHONPATH=src streamlit run app/streamlit_app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1

      - name: Capture the running Streamlit app
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p docs/screenshots
          cat > /tmp/capture.py <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path("docs/screenshots")
          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox"])
              page = browser.new_page(viewport={"width": 1440, "height": 1000}, device_scale_factor=1)
              page.goto("http://127.0.0.1:8501", wait_until="domcontentloaded", timeout=60_000)
              page.get_by_text("Multi-Asset Backtesting Engine", exact=True).first.wait_for(timeout=60_000)
              page.wait_for_timeout(5_000)
              page.screenshot(path=out / "01-dashboard.png", full_page=False)

              page.locator('[data-testid="stSelectbox"]').nth(1).locator('button').click()
              page.get_by_text("Mean Reversion", exact=True).last.click()
              page.wait_for_timeout(4_000)
              page.screenshot(path=out / "02-mean-reversion.png", full_page=False)

              page.locator('[data-testid="stSelectbox"]').nth(0).locator('button').click()
              page.get_by_text("S&P 500 E-mini", exact=True).last.click()
              page.wait_for_timeout(4_000)
              page.screenshot(path=out / "03-es-futures.png", full_page=False)
              browser.close()
          PY
          python /tmp/capture.py
          file docs/screenshots/*.png

      - name: Add screenshots to README and remove one-off workflow
        if: steps.guard.outputs.skip != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          readme = Path("README.md")
          text = readme.read_text()
          if "## Application screenshots" not in text:
              section = '''## Application screenshots\n\nThe following screenshots are captured from the running Streamlit application and show the live dashboard, mean-reversion workflow, and S&P 500 E-mini futures configuration.\n\n### Dashboard\n\n![Live Streamlit dashboard](docs/screenshots/01-dashboard.png)\n\n### Mean reversion\n\n![Mean-reversion backtest](docs/screenshots/02-mean-reversion.png)\n\n### S&P 500 E-mini futures\n\n![S&P 500 E-mini futures backtest](docs/screenshots/03-es-futures.png)\n\n'''
              readme.write_text(text.replace("## How it works", section + "## How it works", 1))
          Path(".github/workflows/capture-screenshots.yml").unlink()
          PY

      - name: Commit screenshots and README
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots README.md .github/workflows/capture-screenshots.yml
          git commit -m "docs: add Streamlit application screenshots"
          git push
