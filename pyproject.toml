[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
